<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Собрать свою будку — Мастерская Савеловых</title>
<meta name="description" content="Онлайн-конструктор будки для собаки: выберите размер, цвет деталей и нарисуйте свой эскиз. Мастерская Савеловых, Чита.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍂</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --wood-dark: #2C2416;
    --wood-brown: #8B5A2B;
    --wood-gold: #D4A574;
    --cream: #F5E6D3;

    --autumn-1: #C4571B;
    --autumn-2: #E08A3C;
    --autumn-3: #A03A24;

    --bg: #FBF2E4;
    --bg-card: #ffffff;
    --bg-elevated: #f5ebd9;
    --text: #2C2416;
    --text-2: #7A6B55;
    --border: #e8d9bd;
    --shadow: rgba(44, 36, 22, 0.1);
    --shadow-hover: rgba(44, 36, 22, 0.18);
    --accent: #C4571B;
  }

  body.dark {
    --bg: #1a130d;
    --bg-card: #251c15;
    --bg-elevated: #2e241a;
    --text: #F5E6D3;
    --text-2: #b09a7c;
    --border: #3a2d20;
    --shadow: rgba(0, 0, 0, 0.4);
    --shadow-hover: rgba(0, 0, 0, 0.6);
    --cream: #F5E6D3;
    --accent: #E08A3C;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    line-height: 1.6;
    transition: background 0.5s, color 0.5s;
  }

  /* ===== NAV ===== */
  nav {
    padding: 16px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    transition: background 0.5s;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 900;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }
  .logo::before { content: '🍂'; font-size: 22px; }
  .logo span { color: var(--accent); }

  nav .nav-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .back-link {
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 18px;
    border-radius: 50px;
    transition: all 0.3s;
    border: 1px solid var(--border);
  }
  .back-link:hover { background: var(--bg-elevated); color: var(--accent); }

  .theme-mini {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    cursor: pointer;
    font-size: 18px;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .theme-mini:hover { background: var(--border); transform: rotate(20deg); }

  /* ===== CONTAINER ===== */
  .container {
    max-width: 1300px;
    margin: 0 auto;
    padding: 40px 24px 100px;
  }

  .page-header {
    text-align: center;
    margin-bottom: 40px;
  }
  .page-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 5vw, 46px);
    margin-bottom: 10px;
    color: var(--text);
  }
  .page-header h1 span { color: var(--accent); font-style: italic; }
  .page-header p {
    color: var(--text-2);
    font-size: 15px;
  }

  /* ===== GRID ===== */
  .configurator {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 30px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .configurator { grid-template-columns: 1fr; gap: 20px; }
  }

  /* ===== PREVIEW ===== */
  .preview {
    background: var(--bg-card);
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 20px 50px var(--shadow);
    position: sticky;
    top: 90px;
    border: 1px solid var(--border);
    transition: background 0.5s, border-color 0.5s;
  }
  @media (max-width: 900px) {
    .preview { position: static; }
  }
  .preview svg {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 12px;
    overflow: visible;
  }
  .preview svg g[data-part] {
    cursor: pointer;
    transition: filter 0.25s;
  }
  .preview svg g[data-part]:hover {
    filter: brightness(1.12) drop-shadow(0 0 8px var(--autumn-2));
  }
  .preview svg g[data-part].active {
    filter: drop-shadow(0 0 12px var(--autumn-2));
  }

  .preview svg g[data-part].active > polygon,
  .preview svg g[data-part].active > rect,
  .preview svg g[data-part].active > circle:first-of-type {
    stroke: var(--autumn-1) !important;
    stroke-width: 3 !important;
  }

  .size-info {
    text-align: center;
    margin-top: 16px;
    padding: 12px 16px;
    background: var(--bg-elevated);
    border-radius: 12px;
    font-size: 13px;
    color: var(--text-2);
    transition: background 0.5s;
  }
  .size-info strong { color: var(--text); }

  .preview-tools {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .tool-btn {
    padding: 8px 16px;
    border-radius: 50px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.25s;
  }
  .tool-btn:hover { background: var(--bg-elevated); border-color: var(--autumn-1); }
  .tool-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: transparent;
  }

  /* ===== CONTROLS ===== */
  .controls { display: flex; flex-direction: column; gap: 18px; }

  .panel {
    background: var(--bg-card);
    border-radius: 20px;
    padding: 22px;
    box-shadow: 0 10px 30px var(--shadow);
    border: 1px solid var(--border);
    transition: background 0.5s, border-color 0.5s;
  }
  .panel h3 {
    font-family: 'Playfair Display', serif;
    font-size: 19px;
    margin-bottom: 16px;
    color: var(--text);
  }
  .panel h3 small {
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    color: var(--text-2);
    font-weight: 400;
    margin-left: 8px;
  }

  /* Размеры */
  .sizes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .size-btn {
    padding: 14px 10px;
    background: var(--bg-elevated);
    border: 2px solid transparent;
    border-radius: 14px;
    cursor: pointer;
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    transition: all 0.25s;
  }
  .size-btn:hover { border-color: var(--autumn-2); }
  .size-btn.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }
  body.dark .size-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .size-btn small {
    display: block;
    font-size: 11px;
    color: var(--text-2);
    margin-top: 4px;
    font-weight: 400;
  }
  .size-btn.active small { color: inherit; opacity: 0.8; }

  /* Детали */
  .parts-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .part-btn {
    padding: 12px;
    background: var(--bg-elevated);
    border: 2px solid transparent;
    border-radius: 12px;
    cursor: pointer;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    transition: all 0.25s;
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: flex-start;
  }
  .part-btn:hover { border-color: var(--autumn-2); }
  .part-btn.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }
  body.dark .part-btn.active {
    background: var(--accent);
    color: #fff;
  }
  .part-btn .pb-color {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.15);
    flex-shrink: 0;
    transition: background 0.3s;
  }

  /* Цвета */
  .colors {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
  }
  @media (max-width: 500px) {
    .colors { grid-template-columns: repeat(4, 1fr); }
  }
  .swatch {
    aspect-ratio: 1;
    border-radius: 12px;
    cursor: pointer;
    border: 3px solid transparent;
    transition: all 0.2s;
    position: relative;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
  }
  .swatch:hover { transform: scale(1.08); }
  .swatch.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(196, 87, 27, 0.35);
  }
  .swatch .sw-name {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--text-2);
    white-space: nowrap;
    pointer-events: none;
  }

  .color-name {
    text-align: center;
    margin-top: 28px;
    font-size: 13px;
    color: var(--text-2);
  }
  .color-name strong { color: var(--text); }

  /* Сводка */
  .summary {
    background: var(--bg-elevated);
    border-radius: 14px;
    padding: 16px;
    font-size: 13px;
    line-height: 1.9;
    transition: background 0.5s;
  }
  .summary .row {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px dashed var(--border);
    padding: 4px 0;
    gap: 12px;
  }
  .summary .row:last-child { border-bottom: none; }
  .summary .row span:first-child { color: var(--text-2); }
  .summary .row span:last-child {
    font-weight: 600;
    color: var(--text);
    text-align: right;
  }
  .summary .row .sw-dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    border: 1px solid rgba(0,0,0,0.15);
  }

  /* Форма заявки */
  .order-form input,
  .order-form textarea {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    margin-bottom: 10px;
    background: var(--bg-elevated);
    color: var(--text);
    transition: border-color 0.3s, background 0.3s;
    resize: vertical;
  }
  .order-form input:focus,
  .order-form textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  .order-form textarea { min-height: 70px; }

  .submit-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--autumn-1), var(--autumn-2));
    color: #fff;
    border: none;
    border-radius: 50px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 8px 25px rgba(196, 87, 27, 0.35);
  }
  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 40px rgba(196, 87, 27, 0.5);
  }

  /* ===== РИСОВАЛКА ===== */
  .drawer-section {
    margin-top: 40px;
  }
  .drawer-head {
    text-align: center;
    margin-bottom: 20px;
  }
  .drawer-head h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(24px, 3.5vw, 36px);
    color: var(--text);
    margin-bottom: 8px;
  }
  .drawer-head h2 span { color: var(--accent); font-style: italic; }
  .drawer-head p { color: var(--text-2); font-size: 14px; }

  .canvas-wrap {
    background: var(--bg-card);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 20px 50px var(--shadow);
    border: 1px solid var(--border);
    transition: background 0.5s, border-color 0.5s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  #drawCanvas {
    max-width: 100%;
    height: auto;
    border-radius: 14px;
    background: #fffdf8;
    cursor: crosshair;
    touch-action: none;
    box-shadow: inset 0 0 0 1px var(--border);
    border: 2px dashed transparent;
    transition: border-color 0.3s;
  }
  body.dark #drawCanvas { background: #f5ebd9; }

  .drawer-tools {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
    padding: 8px;
  }
  .drawer-tool {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-elevated);
    padding: 6px 12px;
    border-radius: 50px;
    font-size: 12px;
    color: var(--text);
  }
  .drawer-tool label {
    font-weight: 500;
    color: var(--text-2);
    font-size: 11px;
  }
  .color-pick {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    background: transparent;
    padding: 0;
    overflow: hidden;
  }
  .color-pick::-webkit-color-swatch-wrapper { padding: 0; }
  .color-pick::-webkit-color-swatch { border: 2px solid var(--border); border-radius: 50%; }
  .color-pick::-moz-color-swatch { border: 2px solid var(--border); border-radius: 50%; }

  .drawer-preset {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.2s, border-color 0.2s;
  }
  .drawer-preset:hover { transform: scale(1.15); }
  .drawer-preset.active { border-color: var(--text); }

  .size-slider {
    width: 100px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .drawer-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .action-btn {
    padding: 10px 20px;
    border-radius: 50px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .action-btn:hover {
    background: var(--bg-elevated);
    border-color: var(--autumn-2);
    transform: translateY(-2px);
  }
  .action-btn.primary {
    background: linear-gradient(135deg, var(--autumn-1), var(--autumn-2));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 6px 20px rgba(196, 87, 27, 0.35);
  }
  .action-btn.primary:hover {
    background: linear-gradient(135deg, var(--autumn-2), var(--autumn-1));
    color: #fff;
  }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--wood-dark);
    color: var(--cream);
    padding: 14px 26px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 500;
    z-index: 3000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
  }
  body.dark .toast {
    background: var(--bg-card);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ===== ФУТЕР ===== */
  footer {
    background: #1a120a;
    color: #a09483;
    padding: 30px 40px;
    text-align: center;
    font-size: 13px;
  }
  footer a {
    color: var(--autumn-2);
    text-decoration: none;
  }

  /* ===== МОБИЛЬНАЯ АДАПТАЦИЯ ===== */
  @media (max-width: 900px) {
    nav { padding: 12px 20px; }
    .container { padding: 24px 16px 80px; }
    .preview { padding: 16px; }
    .panel { padding: 18px; }
    .colors { grid-template-columns: repeat(6, 1fr); }
  }
  @media (max-width: 500px) {
    .colors { grid-template-columns: repeat(4, 1fr); }
    .parts-list { grid-template-columns: 1fr 1fr; }
    .size-btn { padding: 10px 6px; font-size: 11px; }
    .back-link span { display: none; }
  }
</style>
</head>
<body>
