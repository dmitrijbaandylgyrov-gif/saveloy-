<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Собрать свою будку — Мастерская Савеловых</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Montserrat', sans-serif;
    background: #F5E6D3;
    color: #2C2416;
  }

  nav {
    padding: 18px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #2C2416;
    color: #F5E6D3;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 900;
  }
  .logo span { color: #D4A574; }
  nav a {
    color: #F5E6D3;
    text-decoration: none;
    font-size: 14px;
    transition: color 0.3s;
  }
  nav a:hover { color: #D4A574; }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 24px 100px;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 5vw, 48px);
    text-align: center;
    margin-bottom: 8px;
  }
  .subtitle {
    text-align: center;
    color: #7A6B55;
    margin-bottom: 40px;
    font-size: 15px;
  }

  /* Раскладка: слева схема, справа управление */
  .configurator {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .configurator { grid-template-columns: 1fr; gap: 24px; }
  }

  /* Схема */
  .preview {
    background: #fff;
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 20px 50px rgba(44,36,22,0.1);
    position: sticky;
    top: 100px;
  }
  @media (max-width: 900px) {
    .preview { position: static; }
  }
  .preview svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .preview svg g {
    cursor: pointer;
    transition: filter 0.25s;
  }
  .preview svg g:hover {
    filter: brightness(1.12) drop-shadow(0 0 6px #D4A574);
  }
  .preview svg g.active {
    filter: drop-shadow(0 0 10px #D4A574);
  }

  .size-info {
    text-align: center;
    margin-top: 14px;
    padding: 10px 16px;
    background: #F5E6D3;
    border-radius: 12px;
    font-size: 13px;
    color: #7A6B55;
  }
  .size-info strong { color: #2C2416; }

  /* Панель справа */
  .controls { display: flex; flex-direction: column; gap: 18px; }

  .panel {
    background: #fff;
    border-radius: 20px;
    padding: 22px;
    box-shadow: 0 10px 30px rgba(44,36,22,0.07);
  }
  .panel h3 {
    font-family: 'Playfair Display', serif;
    font-size: 19px;
    margin-bottom: 16px;
  }

  /* Размеры */
  .sizes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .size-btn {
    padding: 14px 10px;
    background: #F5E6D3;
    border: 2px solid transparent;
    border-radius: 14px;
    cursor: pointer;
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #2C2416;
    transition: all 0.25s;
  }
  .size-btn:hover { border-color: #D4A574; }
  .size-btn.active {
    background: #2C2416;
    color: #F5E6D3;
    border-color: #2C2416;
  }
  .size-btn small {
    display: block;
    font-size: 11px;
    color: #7A6B55;
    margin-top: 4px;
    font-weight: 400;
  }
  .size-btn.active small { color: #D4A574; }

  /* Выбор детали */
  .part-selector {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .part-btn {
    padding: 12px 6px;
    background: #F5E6D3;
    border: 2px solid transparent;
    border-radius: 12px;
    cursor: pointer;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: #2C2416;
    transition: all 0.25s;
  }
  .part-btn:hover { border-color: #D4A574; }
  .part-btn.active {
    background: #2C2416;
    color: #F5E6D3;
    border-color: #2C2416;
  }

  /* Палитра цветов */
  .colors {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
  }
  @media (max-width: 500px) {
    .colors { grid-template-columns: repeat(4, 1fr); }
  }
  .swatch {
    aspect-ratio: 1;
    border-radius: 10px;
    cursor: pointer;
    border: 3px solid transparent;
    transition: all 0.2s;
    position: relative;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12);
  }
  .swatch:hover { transform: scale(1.08); }
  .swatch.selected {
    border-color: #D4A574;
    box-shadow: 0 0 0 3px rgba(212,165,116,0.35);
  }

  .color-name {
    text-align: center;
    margin-top: 12px;
    font-size: 13px;
    color: #7A6B55;
  }
  .color-name strong { color: #2C2416; }

  /* Сводка */
  .summary {
    background: #F5E6D3;
    border-radius: 14px;
    padding: 16px;
    font-size: 13px;
    line-height: 1.9;
  }
  .summary .row {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px dashed #d9c9ad;
    padding: 4px 0;
  }
  .summary .row:last-child { border-bottom: none; }
  .summary .row span:first-child { color: #7A6B55; }
  .summary .row span:last-child { font-weight: 600; }

  /* Заявка */
  .order-form input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid #e5d9c3;
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    margin-bottom: 10px;
    background: #faf7f1;
    color: #2C2416;
  }
  .order-form input:focus {
    outline: 2px solid #D4A574;
    background: #fff;
  }

  .submit-btn {
    width: 100%;
    padding: 16px;
    background: #2C2416;
    color: #F5E6D3;
    border: none;
    border-radius: 50px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
  }
  .submit-btn:hover {
    background: #8B5A2B;
    transform: translateY(-2px);
  }
</style>
</head>
<body>

<nav>
  <div class="logo">Мастерская <span>Савеловых</span></div>
  <a href="index.html">← На главную</a>
</nav>

<div class="container">
  <h1>Собрать свою будку</h1>
  <p class="subtitle">Выберите размер, цвет каждой детали и отправьте заявку</p>

  <div class="configurator">

    <!-- Схема -->
    <div class="preview">
      <svg viewBox="0 0 400 420" id="doghouse">
        <g id="roof" data-part="roof">
          <polygon points="200,60 50,180 350,180" fill="#A0704A" stroke="#5C3A1E" stroke-width="2" stroke-linejoin="round"/>
        </g>
        <g id="walls" data-part="walls">
          <rect x="90" y="180" width="220" height="180" fill="#C0915F" stroke="#5C3A1E" stroke-width="2"/>
        </g>
        <g id="floor" data-part="floor">
          <rect x="80" y="360" width="240" height="22" fill="#7B5230" stroke="#5C3A1E" stroke-width="2"/>
        </g>
        <g id="entrance" data-part="entrance">
          <circle cx="200" cy="280" r="55" fill="#3D2410" stroke="#5C3A1E" stroke-width="2"/>
        </g>
      </svg>
      <div class="size-info" id="sizeInfo">
        <strong>Средняя будка:</strong> 800 × 700 × 800 мм
      </div>
    </div>

    <!-- Управление -->
    <div class="controls">

      <!-- Размеры -->
      <div class="panel">
        <h3>1. Размер</h3>
        <div class="sizes">
          <button class="size-btn" data-size="small">
            Маленькая
            <small>600×600×600 мм</small>
          </button>
          <button class="size-btn active" data-size="medium">
            Средняя
            <small>800×700×800 мм</small>
          </button>
          <button class="size-btn" data-size="large">
            Большая
            <small>1000×900×900 мм</small>
          </button>
        </div>
      </div>

      <!-- Деталь -->
      <div class="panel">
        <h3>2. Выберите деталь</h3>
        <div class="part-selector">
          <button class="part-btn active" data-part="walls">Стены</button>
          <button class="part-btn" data-part="roof">Крыша</button>
          <button class="part-btn" data-part="floor">Пол</button>
          <button class="part-btn" data-part="entrance">Вход</button>
        </div>
      </div>

      <!-- Цвета -->
      <div class="panel">
        <h3>3. Цвет детали</h3>
        <div class="colors" id="colors"></div>
        <div class="color-name">Выбрано: <strong id="currentColorName">Натуральное</strong></div>
      </div>

      <!-- Сводка -->
      <div class="panel">
        <h3>Ваша будка</h3>
        <div class="summary" id="summary"></div>
      </div>

      <!-- Заявка -->
      <div class="panel order-form">
        <h3>Оформить заявку</h3>
        <input type="text" id="nameInput" placeholder="Ваше имя">
        <input type="tel" id="phoneInput" placeholder="Телефон">
        <button class="submit-btn" onclick="sendOrder()">Отправить в Telegram</button>
      </div>

    </div>
  </div>
</div>

<script>
  // Палитра
  const palette = [
    { name: 'Светлое дерево', hex: '#D4B48C' },
    { name: 'Натуральное',    hex: '#C0915F' },
    { name: 'Тёмное дерево',  hex: '#7B5230' },
    { name: 'Орех',           hex: '#5C3A1E' },
    { name: 'Под лак',        hex: '#8B6F47' },
    { name: 'Белый',          hex: '#F0F0F0' },
    { name: 'Серый',          hex: '#9E9E9E' },
    { name: 'Графит',         hex: '#4A4A4A' },
    { name: 'Зелёный',        hex: '#4A7C59' },
    { name: 'Синий',          hex: '#3A5A8C' },
    { name: 'Красный',        hex: '#A0392B' },
    { name: 'Шоколад',        hex: '#6B4423' }
  ];

  const parts = {
    walls:    { name: 'Стены', color: '#C0915F', colorName: 'Натуральное' },
    roof:     { name: 'Крыша', color: '#A0704A', colorName: 'Натуральное' },
    floor:    { name: 'Пол',   color: '#7B5230', colorName: 'Натуральное' },
    entrance: { name: 'Вход',  color: '#3D2410', colorName: 'Натуральное' }
  };

  const sizes = {
    small:  { name: 'Маленькая', dims: '600 × 600 × 600 мм' },
    medium: { name: 'Средняя',   dims: '800 × 700 × 800 мм' },
    large:  { name: 'Большая',   dims: '1000 × 900 × 900 мм' }
  };

  let activePart = 'walls';
  let activeSize = 'medium';

  // Палитра
  const colorsEl = document.getElementById('colors');
  palette.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.style.background = c.hex;
    sw.dataset.hex = c.hex;
    sw.dataset.name = c.name;
    sw.title = c.name;
    sw.onclick = () => selectColor(c.hex, c.name);
    colorsEl.appendChild(sw);
  });

  function selectColor(hex, name) {
    // Красим только основную фигуру детали
    const g = document.querySelector(`[data-part="${activePart}"]`);
    const mainShape = g.querySelector('polygon, rect, circle');
    if (mainShape) mainShape.setAttribute('fill', hex);

    parts[activePart].color = hex;
    parts[activePart].colorName = name;

    document.querySelectorAll('.swatch').forEach(s => {
      s.classList.toggle('selected', s.dataset.hex === hex);
    });

    document.getElementById('currentColorName').textContent = name;
    updateSummary();
  }

  function setActivePart(part) {
    activePart = part;
    document.querySelectorAll('.part-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.part === part);
    });
    document.querySelectorAll('#doghouse g').forEach(g => {
      g.classList.toggle('active', g.dataset.part === part);
    });

    // Показать текущий цвет детали в палитре
    const currentHex = parts[part].color;
    document.querySelectorAll('.swatch').forEach(s => {
      s.classList.toggle('selected', s.dataset.hex === currentHex);
    });
    document.getElementById('currentColorName').textContent = parts[part].colorName;
  }

  document.querySelectorAll('.part-btn').forEach(btn => {
    btn.onclick = () => setActivePart(btn.dataset.part);
  });

  document.querySelectorAll('#doghouse g[data-part]').forEach(g => {
    g.onclick = () => setActivePart(g.dataset.part);
  });

  // Размеры
  function setSize(size) {
    activeSize = size;
    document.querySelectorAll('.size-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.size === size);
    });

    // Меняем пропорции будки
    const svg = document.getElementById('doghouse');
    if (size === 'small') {
      svg.querySelector('[data-part="walls"] rect').setAttribute('x', '110');
      svg.querySelector('[data-part="walls"] rect').setAttribute('width', '180');
      svg.querySelector('[data-part="walls"] rect').setAttribute('height', '160');
      svg.querySelector('[data-part="floor"] rect').setAttribute('x', '100');
      svg.querySelector('[data-part="floor"] rect').setAttribute('width', '200');
      svg.querySelector('[data-part="floor"] rect').setAttribute('y', '340');
      svg.querySelector('[data-part="entrance"] circle').setAttribute('r', '45');
      svg.querySelector('[data-part="entrance"] circle').setAttribute('cy', '260');
      svg.querySelector('[data-part="roof"] polygon').setAttribute('points', '200,80 70,180 330,180');
    } else if (size === 'large') {
      svg.querySelector('[data-part="walls"] rect').setAttribute('x', '60');
      svg.querySelector('[data-part="walls"] rect').setAttribute('width', '280');
      svg.querySelector('[data-part="walls"] rect').setAttribute('height', '200');
      svg.querySelector('[data-part="floor"] rect').setAttribute('x', '50');
      svg.querySelector('[data-part="floor"] rect').setAttribute('width', '300');
      svg.querySelector('[data-part="floor"] rect').setAttribute('y', '380');
      svg.querySelector('[data-part="entrance"] circle').setAttribute('r', '65');
      svg.querySelector('[data-part="entrance"] circle').setAttribute('cy', '290');
      svg.querySelector('[data-part="roof"] polygon').setAttribute('points', '200,50 30,180 370,180');
    } else {
      svg.querySelector('[data-part="walls"] rect').setAttribute('x', '90');
      svg.querySelector('[data-part="walls"] rect').setAttribute('width', '220');
      svg.querySelector('[data-part="walls"] rect').setAttribute('height', '180');
      svg.querySelector('[data-part="floor"] rect').setAttribute('x', '80');
      svg.querySelector('[data-part="floor"] rect').setAttribute('width', '240');
      svg.querySelector('[data-part="floor"] rect').setAttribute('y', '360');
      svg.querySelector('[data-part="entrance"] circle').setAttribute('r', '55');
      svg.querySelector('[data-part="entrance"] circle').setAttribute('cy', '280');
      svg.querySelector('[data-part="roof"] polygon').setAttribute('points', '200,60 50,180 350,180');
    }

    document.getElementById('sizeInfo').innerHTML =
      `<strong>${sizes[size].name} будка:</strong> ${sizes[size].dims}`;

    updateSummary();
  }

  document.querySelectorAll('.size-btn').forEach(btn => {
    btn.onclick = () => setSize(btn.dataset.size);
  });

  // Сводка
  function updateSummary() {
    document.getElementById('summary').innerHTML = `
      <div class="row"><span>Размер</span><span>${sizes[activeSize].name}</span></div>
      <div class="row"><span>Стены</span><span>${parts.walls.colorName}</span></div>
      <div class="row"><span>Крыша</span><span>${parts.roof.colorName}</span></div>
      <div class="row"><span>Пол</span><span>${parts.floor.colorName}</span></div>
      <div class="row"><span>Вход</span><span>${parts.entrance.colorName}</span></div>
    `;
  }

  // Отправка
  function sendOrder() {
    const name = document.getElementById('nameInput').value.trim();
    const phone = document.getElementById('phoneInput').value.trim();

    if (!name || !phone) {
      alert('Пожалуйста, введите имя и телефон');
      return;
    }

    const text =
`🐶 Заявка с сайта «Мастерская Савеловых»

Имя: ${name}
Телефон: ${phone}

Будка:
• Размер: ${sizes[activeSize].name} (${sizes[activeSize].dims})
• Стены: ${parts.walls.colorName}
• Крыша: ${parts.roof.colorName}
• Пол: ${parts.floor.colorName}
• Вход: ${parts.entrance.colorName}`;

    window.open(`https://t.me/savelov_workshop?text=${encodeURIComponent(text)}`, '_blank');
  }

  updateSummary();
  setActivePart('walls');
</script>

</body>
</html>
